name: 每日更新监控数据

on:
  schedule:
    # 固定时点，北京时间。GitHub 定时任务会丢跑/延迟（实测延迟可达 4-7 小时），
    # 故收盘后密集排多个时点做重试，命中率优先；每次运行都会重新生成并提交页面（幂等）。
    - cron: "0 0 * * *"     # 08:00 晨间
    - cron: "30 7 * * *"    # 15:30 收盘
    - cron: "5 8 * * *"     # 16:05
    - cron: "35 8 * * *"    # 16:35
    - cron: "5 9 * * *"     # 17:05
    - cron: "35 9 * * *"    # 17:35
    - cron: "5 10 * * *"    # 18:05
    - cron: "35 10 * * *"   # 18:35
    - cron: "5 11 * * *"    # 19:05
    - cron: "5 12 * * *"    # 20:05
    - cron: "5 13 * * *"    # 21:05
    - cron: "5 14 * * *"    # 22:05
    - cron: "5 15 * * *"    # 23:05
    - cron: "5 16 * * *"    # 次日 00:05
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
          fc-cache -f -v
          pip install akshare pandas numpy matplotlib

      - name: 生成监控页面
        run: python .github/workflows/generate_page.py

      - name: 同步完整 index.html 到 main 分支（供 EdgeOne Pages 检出）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只跟踪 public/index.html，其他 public 产物不纳入
          git add -f public/index.html
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "chore: 每日更新监控页面 (auto-commit for EdgeOne Pages)"
            git push origin main
          fi

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4